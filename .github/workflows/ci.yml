name: CI

# 触发:push 到任意分支 + 任意 PR。用于及早发现编译问题。
# 发版打包由 release.yml(仅 tag)负责,与本 workflow 互不干扰。
on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]   # tag 推送交给 release.yml,这里不重复跑
  pull_request:

jobs:
  # ─────────────────────────────────────────────────
  # macOS:验证 SwiftPM + build.sh 双架构编译
  # ─────────────────────────────────────────────────
  macos-build:
    name: macOS build (universal)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: SwiftPM build (CLI 算法验证)
        run: swift build

      - name: Build macOS GUI app
        run: |
          mkdir -p build/app
          xcodebuild -project SoundSense.xcodeproj \
            -target SoundSenseMac \
            -sdk macosx \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build/app" \
            build
          test -f build/app/SoundSenseMac.app/Contents/MacOS/SoundSenseMac
          echo "✅ macOS GUI app 编译成功"

  # ─────────────────────────────────────────────────
  # iOS:验证 Xcode 工程能编译 iOS target
  # ─────────────────────────────────────────────────
  ios-build:
    name: iOS build
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Download iOS simulator runtime
        run: xcodebuild -downloadPlatform iOS

      - name: Resolve packages
        run: |
          xcodebuild -project SoundSense.xcodeproj -resolvePackageDependencies

      - name: Build iOS target
        run: |
          xcodebuild -project SoundSense.xcodeproj \
            -scheme SoundSense \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build/app" \
            build

  # ─────────────────────────────────────────────────
  # watchOS:验证 Xcode 工程能编译 watchOS target
  # ─────────────────────────────────────────────────
  watchos-build:
    name: watchOS build
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Download watchOS simulator runtime
        run: xcodebuild -downloadPlatform watchOS

      - name: Resolve packages
        run: |
          xcodebuild -project SoundSense.xcodeproj -resolvePackageDependencies

      - name: Build watchOS target
        run: |
          xcodebuild -project SoundSense.xcodeproj \
            -target SoundSenseWatch \
            -sdk watchos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build/app" \
            build
