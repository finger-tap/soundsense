name: CI

# 触发:push 到任意分支 + 任意 PR。用于及早发现编译问题。
# 发版打包由 release.yml(仅 tag)负责,与本 workflow 互不干扰。
on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]   # v 前缀 tag 交给 release.yml
  pull_request:

jobs:
  # ─────────────────────────────────────────────────
  # 纯逻辑算法测试(swiftc 直跑,不依赖 simulator)
  # ─────────────────────────────────────────────────
  logic-tests:
    name: Logic tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Run logic tests
        run: ./scripts/logic_tests.sh

  # ─────────────────────────────────────────────────
  # macOS:验证 SwiftPM + build.sh 双架构编译
  # ─────────────────────────────────────────────────
  macos-build:
    name: macOS build (universal)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: SwiftPM build (CLI 算法验证)
        run: |
          mkdir -p build
          set -o pipefail
          if ! swift build --package-path Core 2>&1 | tee build/swiftpm-build.log; then
            grep -E 'error:|fatal error:' build/swiftpm-build.log | head -20 | while IFS= read -r line; do
              echo "::error title=SwiftPM build::$line"
            done
            exit 1
          fi

      - name: Typecheck CLI against macOS deployment target
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          xcrun swiftc -typecheck -swift-version 5 \
            -target arm64-apple-macosx11.0 \
            -sdk "$SDK" \
            -I Core/.build/arm64-apple-macosx/debug/Modules \
            Core/Sources/soundsense/main.swift

      - name: Build macOS GUI app
        run: |
          mkdir -p build/app
          xcodebuild -project SoundSense.xcodeproj \
            -target SoundSenseMac \
            -sdk macosx \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build/app" \
            build
          test -f build/app/SoundSense.app/Contents/MacOS/SoundSense
          echo "✅ macOS GUI app 编译成功"

  # ─────────────────────────────────────────────────
  # iOS:验证 Xcode 工程能编译 iOS target
  # ─────────────────────────────────────────────────
  ios-build:
    name: iOS build
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Build iOS target
        run: |
          mkdir -p build/app
          set -o pipefail
          xcodebuild -project SoundSense.xcodeproj \
            -target SoundSense \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build/app" \
            build 2>&1 | tee build/ios-build.log
          test -d build/app/SoundSense.app

  # ─────────────────────────────────────────────────
  # watchOS:验证 Xcode 工程能编译 watchOS target
  # ─────────────────────────────────────────────────
  watchos-build:
    name: watchOS build
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Build watchOS target
        run: |
          mkdir -p build/app
          set -o pipefail
          xcodebuild -project SoundSense.xcodeproj \
            -target SoundSenseWatch \
            -sdk watchos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build/app" \
            build 2>&1 | tee build/watchos-build.log
          test -d build/app/SoundSenseWatch.app
