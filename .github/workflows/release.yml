name: Release

# 两种触发方式:
#   1. push tag —— 纯数字版本(如 1.0)或 v 前缀(兼容旧约定)
#   2. 手动触发(workflow_dispatch)—— 推荐流程:平时推 main 只跑 CI,
#      想发版时在 Actions 页面点 "Run workflow" 输入版本号,一次打包+发 Release,
#      不需要再打 tag(gh 会自动在当前 main HEAD 上创建 tag)。
on:
  push:
    tags:
      - '[0-9]*'  # 新约定:纯数字版本号(如 1.0、1.1.2)
      - 'v*'      # 旧约定:v 前缀,保留兼容
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(如 1.6.2,不带 v)'
        required: true

permissions:
  contents: write

env:
  # 原始版本输入:手动触发时是 inputs.version(纯数字),tag 触发时是 ref_name(v1.x.x)
  VERSION_SOURCE: ${{ inputs.version || github.ref_name }}

jobs:
  # ─────────────────────────────────────────────────
  # macOS universal .app + DMG(不签名)
  # ─────────────────────────────────────────────────
  macos:
    name: macOS universal DMG (GUI app)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Resolve packages
        run: |
          xcodebuild -project SoundSense.xcodeproj -resolvePackageDependencies

      # 编译 macOS GUI app(universal binary: arm64 + x86_64)。
      # 用 -target + -sdk macosx + ARCHS 出双架构,无需 simulator runtime。
      - name: Build macOS GUI app (universal)
        run: |
          mkdir -p build
          xcodebuild -project SoundSense.xcodeproj \
            -target SoundSenseMac \
            -sdk macosx \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build/app" \
            build

      - name: Verify universal binary
        run: |
          BIN="build/app/SoundSense.app/Contents/MacOS/SoundSense"
          if [ ! -f "$BIN" ]; then echo "❌ 未生成可执行文件"; exit 1; fi
          ARCHS=$(lipo -archs "$BIN")
          echo "二进制架构: $ARCHS"
          if [[ "$ARCHS" != *"arm64"* || "$ARCHS" != *"x86_64"* ]]; then
            echo "❌ 产物未包含双架构"
            exit 1
          fi

      # 打 DMG(拖拽安装),带品牌背景图
      - name: Package DMG
        run: |
          RELEASE_VERSION="${VERSION_SOURCE#v}"
          VERSION="${RELEASE_VERSION}"
          DMG_NAME="SoundSense-${VERSION}.dmg"
          STAGING="build/dmg-staging"
          mkdir -p "$STAGING"
          cp -R build/app/SoundSense.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          # 生成品牌背景图(1280×800 @2x)并放入隐藏目录
          swift scripts/make_dmg_background.swift build/dmg_background.png
          mkdir -p "$STAGING/.background"
          cp build/dmg_background.png "$STAGING/.background/background.png"

          TMP_DMG="build/tmp-$DMG_NAME"
          hdiutil create -volname "闻声 SoundSense" \
            -srcfolder "$STAGING" \
            -fs HFS+ \
            -format UDRW \
            "$TMP_DMG" >/dev/null 2>&1

          MOUNT_POINT=$(hdiutil attach -readwrite -noverify -noautoopen "$TMP_DMG" 2>/dev/null \
            | grep -o '/Volumes/.*' | head -1)

          if [ -n "$MOUNT_POINT" ]; then
            # 等 Finder 完成挂载识别,否则设置背景/位置可能不生效
            sleep 3
            # 注意:必须是 "icon view options of container window"(逐属性设置),
            # 旧写法 "view options of icon view of container window" 语法报错,
            # 会被下方 2>/dev/null 吞掉导致背景不生效。
            osascript <<APPLESCRIPT 2>/dev/null || true
          tell application "Finder"
            tell disk "$(basename "$MOUNT_POINT")"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set the bounds of container window to {100, 100, 660, 460}
              set icon size of icon view options of container window to 96
              set arrangement of icon view options of container window to not arranged
              -- 背景图:先试 HFS 相对路径,失败再用 POSIX 绝对路径
              try
                set background picture of icon view options of container window to file ".background:background.png"
              on error
                set background picture of icon view options of container window to POSIX file "$MOUNT_POINT/.background/background.png"
              end try
              -- 两个图标当"眼睛"
              set position of item "SoundSense.app" of container window to {150, 120}
              set position of item "Applications" of container window to {410, 120}
              close
              -- 重开一次让背景设置稳定生效
              open
              close
            end tell
          end tell
          APPLESCRIPT
            sleep 2
            hdiutil detach "$MOUNT_POINT" >/dev/null 2>&1
          fi

          hdiutil convert "$TMP_DMG" \
            -format ULMO \
            -imagekey zlib-level=9 \
            -o "build/$DMG_NAME" >/dev/null 2>&1

          rm -f "$TMP_DMG"
          rm -rf "$STAGING"
          ls -la build/*.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/*.dmg

  # ─────────────────────────────────────────────────
  # iOS .ipa(未签名)
  # ─────────────────────────────────────────────────
  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # 下载 iOS simulator runtime(Assets.xcassets 编译需要)。
      # runner 可能未预装与 Xcode 版本匹配的 runtime。
      - name: Download iOS simulator runtime
        run: xcodebuild -downloadPlatform iOS

      - name: Resolve packages
        run: |
          xcodebuild -project SoundSense.xcodeproj -resolvePackageDependencies

      - name: Build iOS .app (unsigned)
        run: |
          mkdir -p build/app
          # 用 -scheme + -destination build 出 .app(CONFIGURATION_BUILD_DIR
          # 指定输出目录,便于后续打包 ipa)。
          xcodebuild -project SoundSense.xcodeproj \
            -scheme SoundSense \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build/app" \
            build
          if [ ! -d build/app/SoundSense.app ]; then
            echo "❌ 未生成 SoundSense.app"
            ls -la build/app/
            exit 1
          fi

      - name: Package unsigned .ipa
        run: |
          mkdir -p build/Payload
          RELEASE_VERSION="${VERSION_SOURCE#v}"
          cp -R build/app/SoundSense.app build/Payload/
          cd build
          zip -qr "SoundSense-iOS-${RELEASE_VERSION}.ipa" Payload
          cd ..
          ls -la build/*.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/*.ipa

  # ─────────────────────────────────────────────────
  # watchOS .ipa(未签名)
  # ─────────────────────────────────────────────────
  watchos:
    name: watchOS IPA (unsigned)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # 下载 watchOS simulator runtime(Assets.xcassets 编译需要)
      - name: Download watchOS simulator runtime
        run: xcodebuild -downloadPlatform watchOS

      - name: Resolve packages
        run: |
          xcodebuild -project SoundSense.xcodeproj -resolvePackageDependencies

      - name: Build watchOS .app (unsigned)
        run: |
          mkdir -p build/app
          # 用 -target + -sdk watchos(而非 -scheme + -destination),
          # 绕过 device destination 解析,更可靠。
          # 注意:-derivedDataPath 必须配合 -scheme,这里用 -target,
          # 所以改用 CONFIGURATION_BUILD_DIR 指定输出目录。
          xcodebuild -project SoundSense.xcodeproj \
            -target SoundSenseWatch \
            -sdk watchos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build/app" \
            build
          if [ ! -d build/app/SoundSenseWatch.app ]; then
            echo "❌ 未生成 SoundSenseWatch.app"
            ls -la build/app/
            exit 1
          fi

      - name: Package unsigned .ipa
        run: |
          mkdir -p build/Payload
          RELEASE_VERSION="${VERSION_SOURCE#v}"
          cp -R build/app/SoundSenseWatch.app build/Payload/
          cd build
          zip -qr "SoundSense-watchOS-${RELEASE_VERSION}.ipa" Payload
          cd ..
          ls -la build/*.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchos-ipa
          path: build/*.ipa

  # ─────────────────────────────────────────────────
  # 汇总:下载三端产物,创建 GitHub Release
  # ─────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [macos, ios, watchos]
    runs-on: ubuntu-latest
    steps:
      # gh release create 内部会调用 git 获取仓库信息,必须有 checkout。
      # 用浅克隆即可(只为提供 git 上下文,不需要完整历史)。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.dmg" -o -name "*.ipa" \) -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_VERSION="${VERSION_SOURCE#v}"
          # tag 统一用纯数字(如 1.0),不再加 v 前缀 —— 否则 gh release create
          # 会在发版时再建一个 v 前缀的重复 tag
          RELEASE_TAG="$RELEASE_VERSION"
          VERSION="${RELEASE_VERSION}"
          gh release create "$RELEASE_TAG" release/* \
            --title "闻声 SoundSense $RELEASE_TAG" \
            --notes "## 闻声 SoundSense $RELEASE_TAG

          ### 📦 下载

          | 平台 | 文件 | 说明 |
          |------|------|------|
          | macOS(Apple Silicon + Intel) | \`SoundSense-${VERSION}.dmg\` | Universal binary,双芯片原生运行 |
          | iOS | \`SoundSense-iOS-${VERSION}.ipa\` | 未签名,需自备签名才能装真机 |
          | watchOS | \`SoundSense-watchOS-${VERSION}.ipa\` | 未签名,需自备签名才能装真机 |

          ### 🍎 macOS 安装

          1. 下载 \`SoundSense-${VERSION}.dmg\`
          2. 双击打开 dmg,将 SoundSense.app 拖入「应用程序」文件夹
          3. 首次打开:右键点击 SoundSense.app → 「打开」→ 确认
          4. 在 系统设置 → 隐私与安全 → 麦克风 中授权

          > ⚠️ 本 app 未签名,macOS 会显示安全提示,右键打开即可。
          > ✅ Universal binary 同时支持 Apple Silicon(M 系列)和 Intel 芯片。

          ### 📱 iOS / ⌚ watchOS

          \`.ipa\` 为未签名包,无法直接安装到真机。如需真机调试:
          1. 用 Xcode 打开 \`SoundSense.xcodeproj\`
          2. 在 Signing & Capabilities 配置你的开发者账号
          3. 连接设备直接 build & run,或用你的证书重签 .ipa

          ### 功能

          - A 计权噪音测量(IEC 61672 标准)
          - FFT 频谱分析(4096 点,vDSP)
          - iOS:实时分贝 + 仪表盘 + 声波 + 频谱图 + 校准
          - watchOS:独立运行,抬腕即测
          - macOS:实时测量 + 算法自验证"
